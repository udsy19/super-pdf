name: Website

# Publishes the one-line installer: curl -fsSL https://udsy19.github.io/super-pdf/install.sh | bash
# Needs GitHub Pages turned on for this repository with "GitHub Actions" as the source.
on:
  push:
    branches: [main]
    paths: [scripts/install.sh, README.md, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        # install.sh at the site root; the index sends visitors to the repository's README.
        run: |
          mkdir -p _site
          cp scripts/install.sh _site/install.sh
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Super PDF</title>
          <meta http-equiv="refresh" content="0; url=https://github.com/udsy19/super-pdf#readme">
          <p><a href="https://github.com/udsy19/super-pdf#readme">Super PDF on GitHub</a></p>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
