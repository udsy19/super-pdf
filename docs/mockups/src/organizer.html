<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Super PDF — Page organiser</title><link rel="stylesheet" href="shared.css"></head>
<body><script src="shared.js"></script>
<script>
const I = SP.I;
const mini = (n, file) => {
  const tbl = n === 3 || n === 9;
  const lines = tbl ? `<div class="mini t" style="top:12%"></div><div class="mini" style="top:22%"></div><div class="mini img" style="top:30%"></div><div class="mini" style="top:58%"></div><div class="mini" style="top:63%"></div><div class="mini" style="top:68%"></div>`
    : `<div class="mini t" style="top:12%"></div><div class="mini" style="top:22%"></div><div class="mini" style="top:27%"></div><div class="mini" style="top:32%"></div><div class="mini" style="top:40%"></div><div class="mini" style="top:45%"></div><div class="mini" style="top:50%"></div><div class="mini" style="top:58%"></div><div class="mini" style="top:63%"></div><div class="mini" style="top:68%"></div><div class="mini" style="top:76%"></div>`;
  return lines + (file ? `<div class="fbar" style="background:${file}"></div>` : "");
};
const card = (n, o = {}) => `<div class="pg-card ${o.cls||""}" ${o.style?`style="${o.style}"`:""}><div class="pg">${mini(n, o.file)}</div>${o.hover?`<div class="hover-acts"><i>${I.rotate}</i><i>${I.rotateR}</i><i>${I.x}</i></div>`:""}<div class="num">${o.label||n}</div></div>`;
const grid = `
  ${card(1)} ${card(2)} ${card(3, {cls:"sel", hover:true})} ${card(4)} ${card(5)}
  ${card(6)} ${card(7, {cls:"ghosted"})} ${card(8, {file:"var(--teal)"})} ${card(9, {file:"var(--teal)"})} ${card(10, {file:"var(--teal)"})}
  ${card(11)} ${card(12)} <div class="pg-card add"><div class="pg">${I.plus}<span>Add pages</span></div><div class="num">&nbsp;</div></div>`;
const full = `<div class="org">
  <div class="grid-o">${grid}
    <div class="ins-line" style="left:454px;top:24px"></div>
    ${card(7, {cls:"drag", style:"position:absolute;left:376px;top:70px;z-index:5", label:"7"})}
  </div>
  <div class="status"><span>12 pages · 1 selected · 3 pages from “Inventory.pdf”</span><span>Drag pages to rearrange. Drop files here to add them. Drag pages to the Desktop to save them as a new PDF.</span></div>
</div>`;
const titlebar = `<div class="titlebar">
  <div class="tb-left"><div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="tbtn icon-only view-pop">${I.sidebar}<span class="chev">${I.chev}</span></div></div>
  <div class="title">Rearrange pages <span class="edited">— Lease agreement.pdf</span></div>
  <div class="tb-right"><div class="tbtn icon-only">${I.rotate}</div><div class="tbtn icon-only">${I.rotateR}</div><div class="tbtn icon-only">${I.trash}</div><div style="width:12px"></div><div class="slider" style="width:90px;--p:50%"></div><div style="width:12px"></div><div class="tbtn prominent" style="padding:0 16px">Done</div></div>
</div>`;
SP.render({ titlebarHTML: titlebar, edited: true, full });
</script></body></html>
